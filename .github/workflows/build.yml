name: Build & Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    name: ${{ matrix.build }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: linux
            os: ubuntu-latest
          - build: macos
            os: macos-latest
          - build: windows
            os: windows-latest

    steps:
      - name: Checkout Pake source
        uses: actions/checkout@v6
        with:
          repository: tw93/Pake

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Setup environment
        uses: ./.github/actions/setup-env
        with:
          mode: build

      - name: Build CLI
        run: pnpm run cli:build

      - name: Rust cache restore
        uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-pronovel-${{ hashFiles('**/Cargo.lock') }}

      # ── Linux ──────────────────────────────────────
      - name: Build ProNovel (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 25
        run: |
          node dist/cli.js "https://pronovel.cc" \
            --name pronovel \
            --width 1200 --height 780 \
            --targets deb,appimage
          mkdir -p output
          for f in *.deb;        do [ -f "$f" ] && mv "$f" output/ProNovel_linux_amd64.deb;        done
          for f in *.AppImage;   do [ -f "$f" ] && mv "$f" output/ProNovel_linux_amd64.AppImage;   done
          ls -la output/

      # ── macOS ──────────────────────────────────────
      - name: Build ProNovel (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 30
        run: |
          node dist/cli.js "https://pronovel.cc" \
            --name ProNovel \
            --width 1200 --height 780 \
            --hide-title-bar \
            --targets universal --multi-arch
          mkdir -p output
          for f in *.dmg; do [ -f "$f" ] && mv "$f" output/ProNovel_macos.dmg; done
          ls -la output/

      # ── Windows ────────────────────────────────────
      - name: Build ProNovel (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 25
        shell: pwsh
        run: |
          node dist/cli.js "https://pronovel.cc" `
            --name ProNovel `
            --width 1200 --height 780 `
            --targets x64
          New-Item -Path output -ItemType Directory -Force
          $msi = Get-ChildItem -Name "*.msi" | Select-Object -First 1
          if ($msi) { Move-Item $msi output\ProNovel_windows_x64.msi }
          Get-ChildItem output\

      # ── Upload to GitHub Release ───────────────────
      - name: Upload to Release
        uses: ncipollo/release-action@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          allowUpdates: true
          omitBody: true
          omitName: true
          artifacts: output/*
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Cache save ─────────────────────────────────
      - name: Rust cache save
        uses: actions/cache/save@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-pronovel-${{ hashFiles('**/Cargo.lock') }}
