name: Build & Release

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Website URL to wrap'
        required: false
        type: string
        default: 'https://pronovel.cc'
      app_name:
        description: 'App display name'
        required: false
        type: string
        default: 'ProNovel'
      width:
        description: 'Window width (px)'
        required: false
        type: string
        default: '1200'
      height:
        description: 'Window height (px)'
        required: false
        type: string
        default: '780'
      platforms:
        description: 'Which platforms to build'
        required: true
        type: choice
        options:
          - all
          - linux
          - macos
          - windows
        default: 'all'
      hide_title_bar:
        description: 'Hide title bar (macOS)'
        required: false
        type: boolean
        default: false
      multi_arch:
        description: 'Universal binary — Intel + Apple Silicon (macOS)'
        required: false
        type: boolean
        default: false
      debug:
        description: 'Enable DevTools'
        required: false
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write   # 允许创建 Release
  actions: write    # 允许 download-artifact 跨 job 共享产物

env:
  APP_URL: ${{ github.event.inputs.url || 'https://pronovel.cc' }}
  APP_NAME: ${{ github.event.inputs.app_name || 'ProNovel' }}
  APP_WIDTH: ${{ github.event.inputs.width || '1200' }}
  APP_HEIGHT: ${{ github.event.inputs.height || '780' }}

jobs:
  # ─── Linux ───────────────────────────────────────
  build-linux:
    name: Linux (.deb + AppImage)
    if: |
      github.event_name == 'push' ||
      github.event.inputs.platforms == 'all' ||
      github.event.inputs.platforms == 'linux'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tw93/Pake

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: ./.github/actions/setup-env
        with:
          mode: build

      - name: Build CLI
        run: pnpm run cli:build

      - name: Rust cache restore
        uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-pronovel-${{ hashFiles('**/Cargo.lock') }}

      - name: Build App
        timeout-minutes: 25
        run: |
          node dist/cli.js "${APP_URL}" \
            --name "${APP_NAME,,}" \
            --width "${APP_WIDTH}" \
            --height "${APP_HEIGHT}" \
            --targets deb,appimage
          mkdir -p output
          for f in *.deb;      do [ -f "$f" ] && mv "$f" output/ProNovel_linux_amd64.deb;      done
          for f in *.AppImage; do [ -f "$f" ] && mv "$f" output/ProNovel_linux_amd64.AppImage; done
          ls -la output/

      - uses: actions/upload-artifact@v4
        with:
          name: pronovel-linux
          path: output/*

      - name: Rust cache save
        uses: actions/cache/save@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-pronovel-${{ hashFiles('**/Cargo.lock') }}

  # ─── macOS ───────────────────────────────────────
  build-macos:
    name: macOS (.dmg)
    if: |
      github.event_name == 'push' ||
      github.event.inputs.platforms == 'all' ||
      github.event.inputs.platforms == 'macos'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tw93/Pake

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: ./.github/actions/setup-env
        with:
          mode: build

      - name: Build CLI
        run: pnpm run cli:build

      - name: Rust cache restore
        uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-pronovel-${{ hashFiles('**/Cargo.lock') }}

      - name: Build App
        timeout-minutes: 30
        run: |
          FLAGS="--width ${APP_WIDTH} --height ${APP_HEIGHT}"
          if [ "${{ github.event.inputs.hide_title_bar || 'false' }}" = "true" ]; then
            FLAGS="${FLAGS} --hide-title-bar"
          fi
          if [ "${{ github.event.inputs.multi_arch || 'false' }}" = "true" ]; then
            FLAGS="${FLAGS} --multi-arch"
          fi
          if [ "${{ github.event.inputs.debug || 'false' }}" = "true" ]; then
            FLAGS="${FLAGS} --debug"
          fi

          node dist/cli.js "${APP_URL}" \
            --name "${APP_NAME}" \
            ${FLAGS} \
            --targets universal

          mkdir -p output
          for f in *.dmg; do [ -f "$f" ] && mv "$f" output/ProNovel_macos.dmg; done
          ls -la output/

      - uses: actions/upload-artifact@v4
        with:
          name: pronovel-macos
          path: output/*

      - name: Rust cache save
        uses: actions/cache/save@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-pronovel-${{ hashFiles('**/Cargo.lock') }}

  # ─── Windows ─────────────────────────────────────
  build-windows:
    name: Windows (.msi)
    if: |
      github.event_name == 'push' ||
      github.event.inputs.platforms == 'all' ||
      github.event.inputs.platforms == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tw93/Pake

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: ./.github/actions/setup-env
        with:
          mode: build

      - name: Build CLI
        run: pnpm run cli:build

      - name: Rust cache restore
        uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-pronovel-${{ hashFiles('**/Cargo.lock') }}

      - name: Build App
        timeout-minutes: 25
        shell: pwsh
        run: |
          node dist/cli.js "$env:APP_URL" `
            --name "$env:APP_NAME" `
            --width "$env:APP_WIDTH" `
            --height "$env:APP_HEIGHT" `
            --targets x64

          New-Item -Path output -ItemType Directory -Force
          $msi = Get-ChildItem -Name "*.msi" | Select-Object -First 1
          if ($msi) { Move-Item $msi output\ProNovel_windows_x64.msi }
          Get-ChildItem output\

      - uses: actions/upload-artifact@v4
        with:
          name: pronovel-windows
          path: output/*

      - name: Rust cache save
        uses: actions/cache/save@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-pronovel-${{ hashFiles('**/Cargo.lock') }}

  # ─── Release ─────────────────────────────────────
  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pronovel-*
          merge-multiple: true
          path: output

      - name: List artifacts
        run: ls -la output/

      - uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          omitBody: true
          omitName: true
          artifacts: output/*
          token: ${{ secrets.GITHUB_TOKEN }}

  # ─── Deploy Pages ────────────────────────────────
  deploy:
    name: Deploy Download Page
    if: startsWith(github.ref, 'refs/tags/')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
